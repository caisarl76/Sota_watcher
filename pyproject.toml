[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-watcher"
version = "0.1.0"
description = "Track paper/project pages until code or model weights are actually released."
requires-python = ">=3.12"
# 의존성은 이 6개로 제한한다 (docs/DESIGN.md, CLAUDE.md 참고).
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.8",
    "huggingface_hub>=0.23",
    "anthropic>=0.40",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
watch = "release_watcher.cli:app"

[tool.setuptools.packages.find]
include = ["release_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
